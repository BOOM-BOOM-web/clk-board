<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CLKboard — Upgrade Shop</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'><rect x='2' y='5' width='20' height='14' rx='2' fill='%23ff2d8a'/></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="bg-grid" aria-hidden="true"></div>
<div class="bg-glow" aria-hidden="true"></div>

<header class="topbar shop-topbar">
  <a href="index.html" class="back-btn" aria-label="Back to keyboard">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <line x1="19" y1="12" x2="5" y2="12"/>
      <polyline points="12,19 5,12 12,5"/>
    </svg>
    <span>Back</span>
  </a>
  
  <div class="brand">
    <svg class="brand-svg" viewBox="0 0 24 24" aria-hidden="true">
      <path d="M5 7h14l-1.5 9a2 2 0 0 1-2 1.7H8.5a2 2 0 0 1-2-1.7L5 7z" fill="none" stroke="currentColor" stroke-width="1.5"/>
      <path d="M9 7V5a3 3 0 0 1 6 0v2" fill="none" stroke="currentColor" stroke-width="1.5"/>
    </svg>
    <span class="brand-name">CLK<span class="brand-accent">shop</span></span>
  </div>
  
  <div class="stats">
    <div class="stat stat-balance">
      <span class="stat-label">Balance</span>
      <span class="stat-value" id="balance">0</span>
      <span class="stat-unit">CLK</span>
    </div>
  </div>
</header>

<main class="shop-stage">
  <section class="shop-hero">
    <h1 class="shop-title">Upgrade <span class="text-accent">Station</span></h1>
    <p class="shop-subtitle">Convert your CLKs into permanent power. Every upgrade persists across sessions.</p>
  </section>
  
  <section class="upgrades" id="upgrades" aria-label="Available upgrades"></section>
  
  <section class="shop-footer">
    <button class="btn-ghost" id="resetBtn">Reset all progress</button>
  </section>
</main>

<div class="modal-backdrop" id="resetModal" hidden>
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
    <h2 id="modalTitle">Reset all progress?</h2>
    <p class="modal-text">This will erase all your CLKs, upgrades, and stats. This action cannot be undone.</p>
    <div class="modal-actions">
      <button class="btn-ghost" id="cancelReset">Cancel</button>
      <button class="btn-danger" id="confirmReset">Reset everything</button>
    </div>
  </div>
</div>

<div class="toast-container" id="toastContainer" aria-live="polite"></div>

<script src="core.js"></script>
<script src="shop.js"></script>
</body>
</html>
